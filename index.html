<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OyunLand</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#07040f;--card:#130c26;--tx:#efeaff;--mu:#9b8fc9;--ac:#ff2bd6;--ac2:#00f0ff;--bd:#33215e;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f0ff;--card:#fff;--tx:#1a1030;--mu:#6a5d99;--bd:#d6c9ff;color-scheme:light}}
:root[data-theme="light"]{--bg:#f4f0ff;--card:#fff;--tx:#1a1030;--mu:#6a5d99;--bd:#d6c9ff;color-scheme:light}
:root[data-theme="dark"]{--bg:#07040f;--card:#130c26;--tx:#efeaff;--mu:#9b8fc9;--bd:#33215e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--tx);font:16px/1.4 "Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 15% -10%,rgba(255,43,214,.2),transparent 45%),radial-gradient(circle at 95% 0,rgba(0,240,255,.15),transparent 40%),var(--bg)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--ac);box-shadow:0 2px 24px rgba(255,43,214,.25);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
h1{margin:0;font-size:22px;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.coin{font-weight:700;color:var(--ac2);text-shadow:0 0 8px rgba(0,240,255,.6)}
nav{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:10px;transition:.15s}
button:hover{border-color:var(--ac2);box-shadow:0 0 10px rgba(0,240,255,.35)}
button.p,nav button.on{background:linear-gradient(90deg,var(--ac),#8a3cff);color:#fff;border-color:transparent;box-shadow:0 0 14px rgba(255,43,214,.5)}button:disabled{opacity:.5}
main{max-width:900px;margin:0 auto;padding:16px 16px 90px}
h2,h3{text-shadow:0 0 12px rgba(255,43,214,.35)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center;box-shadow:0 0 20px rgba(138,60,255,.15);transition:.15s}
.card:hover{transform:translateY(-3px);border-color:var(--ac)}.card .e{font-size:40px}.mu{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row span{flex:1}.row input{width:110px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ctl button{min-width:56px;min-height:48px;font-size:18px;touch-action:none;user-select:none}
input,textarea{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
textarea{height:140px;font-family:monospace}
iframe{width:100%;height:420px;border:1px solid var(--bd);border-radius:12px;background:#fff}
canvas{border:1px solid var(--ac);box-shadow:0 0 22px rgba(255,43,214,.35);max-width:100%}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9;box-shadow:0 0 18px var(--ac)}
#chat{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(320px,92vw);z-index:8;text-align:right}
#cp{background:var(--card);border:1px solid var(--ac2);border-radius:12px;padding:8px;margin-bottom:8px;text-align:left;box-shadow:0 0 20px rgba(0,240,255,.25)}
#cp[hidden]{display:none}#cl{height:170px;overflow-y:auto;font-size:14px;margin:6px 0;word-break:break-word}
</style></head><body>
<header><h1>⚡ OyunLand</h1>
<nav id="nav"><button data-v="games" class="on">Oyunlar</button><button data-v="shop">Mağaza</button><button data-v="admin">Yönetici</button></nav>
<div class="coin" id="coins"></div></header>
<main id="main"></main><div id="toast"></div>
<div id="chat"><div id="cp" hidden><input id="nk" maxlength="14" placeholder="Takma ad"><div id="cl"></div><div class="row"><input id="ci" maxlength="200" placeholder="Mesaj yaz..."><button class="p" id="cs">Gönder</button></div></div><button id="cb" class="p">💬 Sohbet</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const WEAPONS=[
{id:'pist',n:'Tabanca',e:'🔫',m:1,p:0},{id:'shot',n:'Av Tüfeği',e:'🪖',m:1.5,p:200},
{id:'smg',n:'SMG',e:'💥',m:2,p:500},{id:'snip',n:'Keskin Nişancı',e:'🎯',m:3,p:1200},
{id:'rock',n:'Roketatar',e:'🚀',m:5,p:3000},{id:'laser',n:'Lazer Topu',e:'⚡',m:8,p:8000}];
let S={coins:0,owned:['pist'],eq:'pist',prices:{},custom:[]};
try{const x=localStorage.getItem('oyunland');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem('oyunland',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const price=w=>S.prices[w.id]??w.p;
const mult=()=>WEAPONS.find(w=>w.id===S.eq).m;
let view='games',admin=false,stop=()=>{};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function reward(n){n=Math.round(n*mult());if(n<=0)return toast('Kazanç yok');S.coins+=n;save();head();toast('+'+n+' 🪙 kazandın! (silah x'+mult()+')')}
function head(){$('#coins').textContent='🪙 '+S.coins+' • '+WEAPONS.find(w=>w.id===S.eq).e+' x'+mult()}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));render()});
const GAMES=[
{id:'war',n:'⚔️ Savaş Arenası',e:'🪖',d:'3D online savaş • sohbet'},{id:'aim3',n:'3D Nişancı',e:'🔫',d:'3D hedefleri silahınla vur'},
{id:'run3',n:'3D Koşu',e:'🏃',d:'Engellerden kaç'},{id:'orb3',n:'3D Küp Topla',e:'🟡',d:'Topu yönlendir, küp topla'},
{id:'snake3',n:'3D Yılan',e:'🐍',d:'Elma ye, büyü'},{id:'mem3',n:'3D Hafıza',e:'🧠',d:'Renk eşlerini bul'},
{id:'ref3',n:'3D Refleks',e:'⚡',d:'Yeşilde küreye tıkla'},{id:'mole3',n:'3D Köstebek',e:'🔨',d:'Köstebeklere vur'},{id:'xox3',n:'3D XOX',e:'⭕',d:'Bilgisayara karşı'}];
function render(){stop();stop=()=>{};head();const m=$('#main');
if(view==='games'){m.innerHTML='<h2>Oyunlar</h2><p class="mu">Oyna, oyun parası kazan. Silahın çarpanı kazancı artırır.</p><div class="grid">'+
GAMES.map(g=>card(g.e,g.n,g.d,'play(\''+g.id+'\')')).join('')+S.custom.map((g,i)=>card('🕹️',g.n,'Yüklenen oyun','playC('+i+')')).join('')+'</div><div id="stage" style="margin-top:16px"></div>'}
else if(view==='shop'){m.innerHTML='<h2>Silah Mağazası</h2><div id="wv"></div><p class="mu">3D önizleme için bir silaha dokun.</p><div class="grid">'+WEAPONS.map(w=>{const o=S.owned.includes(w.id);
return '<div class="card" onclick="viewer(\''+w.id+'\')"><div class="e">'+w.e+'</div><b>'+w.n+'</b><div class="mu">Kazanç x'+w.m+'</div><div style="margin:8px 0">'+(o?'Sahipsin':'🪙 '+price(w))+'</div>'+
(o?'<button '+(S.eq===w.id?'disabled':'')+' onclick="equip(\''+w.id+'\')">'+(S.eq===w.id?'Kuşanıldı':'Kuşan')+'</button>':'<button class="p" onclick="buy(\''+w.id+'\')">Satın al</button>')+'</div>'}).join('')+'</div>';viewer(S.eq)}
else adminView()}
const card=(e,n,d,f)=>'<div class="card"><div class="e">'+e+'</div><b>'+n+'</b><div class="mu">'+d+'</div><button class="p" style="margin-top:8px" onclick="'+f+'">Oyna</button></div>';
function buy(id){const w=WEAPONS.find(x=>x.id===id);if(S.coins<price(w))return toast('Yetersiz para!');S.coins-=price(w);S.owned.push(id);S.eq=id;save();render();toast(w.n+' alındı!')}
function equip(id){S.eq=id;save();render()}
function play(id){stop();const st=$('#stage');st.scrollIntoView({behavior:'smooth'});G[id](st)}
function playC(i){stop();const st=$('#stage');st.innerHTML='<h3>'+S.custom[i].n+'</h3><iframe sandbox="allow-scripts"></iframe>';const f=st.querySelector('iframe');f.srcdoc=S.custom[i].code;
const h=e=>{if(e.source===f.contentWindow&&e.data&&typeof e.data.coins==='number')reward(Math.min(Math.max(e.data.coins,0),100))};addEventListener('message',h);stop=()=>removeEventListener('message',h)}
const G={};
function sc3(el,asp){const w=Math.min(640,el.clientWidth||600),h=Math.round(w*asp),r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(w,h);r.domElement.style.cssText='max-width:100%;border-radius:12px;display:block;touch-action:none';el.append(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0x07040f);s.add(new THREE.AmbientLight(0xffffff,.7));const l=new THREE.DirectionalLight(0xffffff,.9);l.position.set(3,8,5);s.add(l);
const c=new THREE.PerspectiveCamera(60,w/h,.1,300);let id,fn;const loop=()=>{id=requestAnimationFrame(loop);fn&&fn();r.render(s,c)};loop();
return{r,s,c,run:f=>fn=f,end:()=>{cancelAnimationFrame(id);r.dispose()}}}
const MT=(c,e)=>new THREE.MeshStandardMaterial({color:c,metalness:.5,roughness:.4,emissive:e||0});
function wmesh(id){const g=new THREE.Group(),C={pist:0x999999,shot:0x8b5a2b,smg:0x55556a,snip:0x3a6a3a,rock:0xb33a22,laser:0x22ccff}[id],L={pist:1,shot:2.2,smg:1.4,snip:2.8,rock:2.4,laser:2}[id];
const add=(geo,c,x,y,z,e)=>{const m=new THREE.Mesh(geo,MT(c,e));m.position.set(x,y,z);g.add(m);return m},B=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
if(id==='rock'||id==='laser'){add(new THREE.CylinderGeometry(.3,.3,L,16),C,0,0,-L/2,id==='laser'?0x0a6688:0).rotation.x=Math.PI/2}else add(B(.25,.3,L),C,0,0,-L/2);
add(B(.12,.12,L*.6),0x222222,0,.02,-L*1.3);add(B(.2,.55,.25),0x2a2a2a,0,-.4,-.15);if(id==='snip')add(B(.15,.15,.6),0x111111,0,.28,-L/2);
g.position.z=L*.65;const w=new THREE.Group();w.add(g);return w}
function viewer(id){stop();stop=()=>{};const el=$('#wv');if(!el||!window.THREE)return;el.innerHTML='';const t=sc3(el,.4);t.c.position.set(0,1.5,7);t.c.lookAt(0,0,0);const w=wmesh(id);w.rotation.x=.25;t.s.add(w);t.run(()=>w.rotation.y+=.02);stop=t.end}
function pick(t,objs,cb){const rc=new THREE.Raycaster();t.r.domElement.addEventListener('pointerdown',e=>{const b=t.r.domElement.getBoundingClientRect();rc.setFromCamera(new THREE.Vector2((e.clientX-b.left)/b.width*2-1,-((e.clientY-b.top)/b.height)*2+1),t.c);const h=rc.intersectObjects(objs)[0];if(h)cb(h.object)})}
function keys(st,k){const M={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',a:'l',d:'r',w:'u',s:'d',' ':'f'};const kd=e=>{if(M[e.key]){k[M[e.key]]=1;e.preventDefault()}},ku=e=>{if(M[e.key])k[M[e.key]]=0};addEventListener('keydown',kd);addEventListener('keyup',ku);
st.querySelectorAll('[data-k]').forEach(b=>{const f=v=>e=>{k[b.dataset.k]=v;e.preventDefault()};b.onpointerdown=f(1);b.onpointerup=b.onpointerleave=f(0)});return()=>{removeEventListener('keydown',kd);removeEventListener('keyup',ku)}}
function tank(col){const g=new THREE.Group(),b=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),MT(c));m.position.set(x,y,z);g.add(m)};b(1.4,.5,2,col,0,.4,0);b(.9,.4,.9,col,0,.85,.1);b(.2,.2,1.4,0x222222,0,.85,-.9);return g}
function label(txt){const cv=document.createElement('canvas');cv.width=256;cv.height=64;const x=cv.getContext('2d');x.font='bold 30px sans-serif';x.fillStyle='#fff';x.textAlign='center';x.fillText(txt,128,42);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true}));sp.scale.set(4,1,1);sp.position.y=2.2;return sp}
const ad=(a,b)=>{let d=(a-b)%(2*Math.PI);if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;return d};
const CT='<div id="cv"></div>';
Object.assign(G,{
aim3(st){st.innerHTML='<h3>🔫 3D Nişancı <span id="i"></span></h3><div id="cv"></div><p class="mu">Hedeflere tıkla / dokun</p>';const t=sc3($('#cv'),.65),{s,c,r}=t;let hits=0,left=25,rc=0,T=[];
c.position.set(0,1.5,0);s.add(c);const wp=wmesh(S.eq);wp.scale.setScalar(.22);c.add(wp);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(60,60),MT(0x1b1146));fl.rotation.x=-Math.PI/2;s.add(fl);
const sp=()=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.8,20,14),MT(0xe8453c,0x330000));m.position.set(Math.random()*16-8,.8+Math.random()*4,-10-Math.random()*15);m.userData.v=(Math.random()-.5)*.08;s.add(m);T.push(m)};for(let i=0;i<4;i++)sp();
const up=()=>$('#i').textContent='— '+hits+' vuruş • '+left+' sn';up();
r.domElement.onpointerdown=e=>{const b=r.domElement.getBoundingClientRect(),rcast=new THREE.Raycaster();rcast.setFromCamera(new THREE.Vector2((e.clientX-b.left)/b.width*2-1,-((e.clientY-b.top)/b.height)*2+1),c);rc=.15;
const h=rcast.intersectObjects(T)[0];if(h){s.remove(h.object);T=T.filter(x=>x!==h.object);hits++;sp();up()}};
t.run(()=>{rc*=.85;wp.position.set(.45,-.4,-1.1+rc);T.forEach(m=>{m.position.x+=m.userData.v;if(Math.abs(m.position.x)>9)m.userData.v*=-1})});
const iv=setInterval(()=>{left--;up();if(left<=0){stop();$('#cv').innerHTML='<p>Bitti! '+hits+' vuruş</p>';reward(hits*6)}},1000);stop=()=>{clearInterval(iv);t.end()}},
run3(st){st.innerHTML='<h3>🏃 3D Koşu <span id="i"></span></h3><div id="cv"></div><div class="row"><button id="l">⬅️ Sol</button><button id="rr">Sağ ➡️</button></div>';const t=sc3($('#cv'),.65),{s,c}=t;let lane=0,tx=0,dist=0,sp=.3,ob=[],dead=0,fr=0;
c.position.set(0,3.5,6);c.lookAt(0,0,-6);const fl=new THREE.Mesh(new THREE.PlaneGeometry(8,200),MT(0x1b1146));fl.rotation.x=-Math.PI/2;fl.position.z=-90;s.add(fl);
const p=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),MT(0x44ddff));p.position.y=.5;s.add(p);
const go=d=>lane=Math.max(-1,Math.min(1,lane+d));$('#l').onclick=()=>go(-1);$('#rr').onclick=()=>go(1);t.r.domElement.onpointerdown=e=>go(e.offsetX<e.target.clientWidth/2?-1:1);
const kd=e=>{if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)};addEventListener('keydown',kd);
t.run(()=>{if(dead)return;fr++;dist+=sp;sp+=.00015;if(fr%Math.max(16,38-(dist/50|0))===0){const m=new THREE.Mesh(new THREE.BoxGeometry(1.4,1.4,1.4),MT(0xe8453c));m.position.set(((Math.random()*3|0)-1)*2,.7,-70);s.add(m);ob.push(m)}
tx+=(lane*2-tx)*.2;p.position.x=tx;$('#i').textContent='— '+(dist|0)+' m';
ob.forEach(m=>{m.position.z+=sp*1.3;if(Math.abs(m.position.z)<1.2&&Math.abs(m.position.x-tx)<1.2&&!dead){dead=1;reward(dist/4);$('#i').textContent='— Çarptın! '+(dist|0)+' m'}});});
stop=()=>{removeEventListener('keydown',kd);t.end()}},
orb3(st){st.innerHTML='<h3>🟡 3D Küp Topla <span id="i"></span></h3><div id="cv"></div><div class="row"><button data-k="l">⬅️</button><button data-k="u">⬆️</button><button data-k="d">⬇️</button><button data-k="r">➡️</button></div>';const t=sc3($('#cv'),.65),{s,c}=t;c.position.set(0,16,11);c.lookAt(0,0,0);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(24,24),MT(0x1b1146));fl.rotation.x=-Math.PI/2;s.add(fl);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.8,24,16),MT(0x44ddff));ball.position.y=.8;s.add(ball);
const cu=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),MT(0xffcc00,0x664400));s.add(cu);const put=()=>cu.position.set(Math.random()*20-10,.8,Math.random()*20-10);put();
const k={},M={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d'},kd=e=>{if(M[e.key]){k[M[e.key]]=1;e.preventDefault()}},ku=e=>{if(M[e.key])k[M[e.key]]=0};addEventListener('keydown',kd);addEventListener('keyup',ku);
st.querySelectorAll('[data-k]').forEach(b=>{const f=v=>e=>{k[b.dataset.k]=v;e.preventDefault()};b.onpointerdown=f(1);b.onpointerup=b.onpointerleave=f(0)});
let n=0,left=30;const up=()=>$('#i').textContent='— '+n+' küp • '+left+' sn';up();
t.run(()=>{const v=.28,q=ball.position;q.x=Math.max(-11,Math.min(11,q.x+(k.r?v:0)-(k.l?v:0)));q.z=Math.max(-11,Math.min(11,q.z+(k.d?v:0)-(k.u?v:0)));cu.rotation.y+=.05;if(q.distanceTo(cu.position)<1.4){n++;put();up()}});
const iv=setInterval(()=>{left--;up();if(left<=0){stop();$('#cv').innerHTML='<p>Bitti! '+n+' küp</p>';reward(n*8)}},1000);stop=()=>{clearInterval(iv);removeEventListener('keydown',kd);removeEventListener('keyup',ku);t.end()}},
snake3(st){st.innerHTML='<h3>🐍 3D Yılan <span id="i"></span></h3>'+CT+'<div class="ctl"><button data-k="l">⬅️</button><button data-k="u">⬆️</button><button data-k="d">⬇️</button><button data-k="r">➡️</button></div>';
const t=sc3($('#cv'),.65),{s,c}=t,N=15,O=7;c.position.set(0,15,10);c.lookAt(0,0,1);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(N,N),MT(0x1b1146));fl.rotation.x=-Math.PI/2;s.add(fl);s.add(new THREE.GridHelper(N,N,0xff2bd6,0x33215e));
let sn=[[7,7]],dx=1,dz=0,ap=[3,3],sc=0,ms=[];const box=c=>{const m=new THREE.Mesh(new THREE.BoxGeometry(.9,.9,.9),MT(c));s.add(m);return m},place=(m,p)=>m.position.set(p[0]-O,.5,p[1]-O),food=box(0xff3355);place(food,ap);
const dir=(a,b)=>{if(a!==-dx||b!==-dz){dx=a;dz=b}},V={l:[-1,0],r:[1,0],u:[0,-1],d:[0,1]};
const kd=e=>{const m={ArrowUp:V.u,ArrowDown:V.d,ArrowLeft:V.l,ArrowRight:V.r,w:V.u,s:V.d,a:V.l,d:V.r}[e.key];if(m){e.preventDefault();dir(...m)}};addEventListener('keydown',kd);
st.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>dir(...V[b.dataset.k]));
const draw=()=>{while(ms.length<sn.length)ms.push(box(0x44ff99));while(ms.length>sn.length)s.remove(ms.pop());sn.forEach((p,i)=>place(ms[i],p))};draw();t.run(()=>food.rotation.y+=.05);
const iv=setInterval(()=>{const h=[sn[0][0]+dx,sn[0][1]+dz];if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||sn.some(p=>p[0]===h[0]&&p[1]===h[1])){clearInterval(iv);$('#i').textContent='— Bitti! Skor '+sc;reward(sc*3);return}
sn.unshift(h);if(h[0]===ap[0]&&h[1]===ap[1]){sc++;ap=[Math.random()*N|0,Math.random()*N|0];place(food,ap);$('#i').textContent='— Skor '+sc}else sn.pop();draw()},130);
